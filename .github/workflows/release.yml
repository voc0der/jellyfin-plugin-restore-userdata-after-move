name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

# One release at a time. Two pushes landing together each derive their version
# from the same latest tag, and `gh release create` tags whatever main points at
# when it runs rather than the commit that was built - which shipped a 1.0.0.4
# whose archives predated the tag they were attached to. Queued, not cancelled:
# every commit on main still gets its own release.
#
# All three keys are load-bearing. `cancel-in-progress: false` protects only the
# run that is *executing*; the pending slot defaults to `queue: single`, which
# cancels the waiting run to make room for a newer one. Under three quick merges
# that silently drops the middle commit's release - not the workflow's stated
# invariant, and invisible afterwards, because the run that vanished is the one
# nobody goes looking for. `queue: max` holds up to 100 pending runs instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch all history for changelog generation

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Generate version and changelog
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: version
      run: |
        # Get the latest tag, or use 1.0.0.0 if none exists
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0.0")
        echo "Latest tag: $LATEST_TAG"

        # Extract version numbers (4-part semantic versioning)
        IFS='.' read -ra VERSION_PARTS <<< "$LATEST_TAG"
        MAJOR=${VERSION_PARTS[0]:-1}
        MINOR=${VERSION_PARTS[1]:-0}
        BUILD=${VERSION_PARTS[2]:-0}
        REVISION=${VERSION_PARTS[3]:-0}

        # Increment revision for each commit
        REVISION=$((REVISION + 1))
        NEW_VERSION="${MAJOR}.${MINOR}.${BUILD}.${REVISION}"

        echo "New version: $NEW_VERSION"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

        # Generate changelog from commits since last tag
        echo "## What's Changed" > CHANGELOG.md
        echo "" >> CHANGELOG.md

        if [ "$LATEST_TAG" != "1.0.0.0" ] || git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
          git log ${LATEST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges >> CHANGELOG.md
        else
          git log --pretty=format:"- %s (%h)" --no-merges >> CHANGELOG.md
        fi

        echo "" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...${NEW_VERSION}" >> CHANGELOG.md

        cat CHANGELOG.md

    # build.sh runs the tests, builds both server lines, and refuses to package if
    # a host assembly leaked into an archive or meta.json disagrees with the
    # target version or ABI.
    - name: Build and package both server lines
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: VERSION="${{ steps.version.outputs.version }}" ./build.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Jellyfin.Plugin.UserDataRestore
        path: artifacts/*.zip
        if-no-files-found: ignore

    # The release is created before manifest.json is touched, and that ordering is
    # load-bearing. The manifest *is* the plugin catalogue — it is served straight
    # off main — so a manifest commit that lands before a failed `gh release create`
    # advertises a version whose download URL 404s and whose checksum matches
    # nothing. That is not hypothetical: on run 31747724320 the release failed on an
    # already-existing tag and left 1.0.0.8 published against an archive that was
    # never uploaded. Failing here instead leaves the catalogue exactly as it was.
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"

        {
          cat CHANGELOG.md
          echo ""
          echo "## Which archive do I want?"
          echo ""
          echo "| Jellyfin | Archive |"
          echo "|---|---|"
          echo "| 10.11.11 | \`RestoreUserDataAfterMove_${VERSION}_jellyfin-10.11.11.zip\` — also available in the plugin catalogue |"
          echo "| 12.0 RC5 | \`RestoreUserDataAfterMove_${VERSION}_jellyfin-12.0.0-rc5.zip\` — manual install |"
          echo ""
          echo "Builds are pinned per server version and the plugin refuses to run on"
          echo "the wrong one, so pick the archive matching your exact server."
        } > RELEASE_NOTES.md

        # --target pins the tag to the commit these artifacts were built from.
        # Without it the tag lands on main's current tip, which is not the same
        # thing once a second merge is in flight.
        gh release create "$VERSION" \
          --title "Release $VERSION" \
          --notes-file RELEASE_NOTES.md \
          --target "${{ github.sha }}" \
          artifacts/*.zip

    # A created release is not the same as a complete one: a partial or dropped
    # asset upload does not fail `gh release create`. The catalogue is about to
    # promise a byte-exact checksum for one of these URLs, so fetch them back and
    # prove the promise before making it.
    - name: Verify the published archives
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        rm -rf published && mkdir -p published
        gh release download "$VERSION" --dir published --clobber

        for local in artifacts/*.zip; do
          name=$(basename "$local")
          if [ ! -f "published/${name}" ]; then
            echo "::error::${name} is missing from release ${VERSION}"
            exit 1
          fi
          if ! cmp -s "$local" "published/${name}"; then
            echo "::error::${name} on release ${VERSION} differs from the archive that was built"
            exit 1
          fi
          echo "verified ${name}"
        done

    # One catalogue per server line, and the split is forced rather than tidy.
    # Jellyfin's targetAbi is a *minimum* (DESIGN §17.3), so an entry built for
    # 10.11.11 is considered installable by a 12.0 server. Publishing only the
    # 10.11 archive therefore does not hide it from 12.0 — it makes the wrong
    # build the only offer a 12.0 server gets, and that build loads and is then
    # refused by the plugin's own version gate. Nothing expressible in one
    # manifest fixes that, so a 12.0 server is pointed at a catalogue whose
    # entries are the 12.0 builds; see README.md.
    - name: Update the plugin catalogues
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        REPO="${{ github.repository }}"

        # Copied, not duplicated. Two catalogues describing the same plugin GUID
        # differently is a bug waiting for somebody to edit one of them.
        SHARED=$(jq -c '.[0] | {guid, name, overview, description, category, owner}' manifest.json)

        publish() {
          manifest="$1"
          zip_name="RestoreUserDataAfterMove_${VERSION}_$2.zip"

          # Both taken from the archive as the release serves it, not from the
          # local build output: the catalogue's checksum then describes the exact
          # bytes behind the URL it publishes, and the ABI cannot disagree with
          # what the plugin itself declares.
          checksum=$(md5sum "published/${zip_name}" | awk '{print $1}')
          abi=$(unzip -p "published/${zip_name}" '*/meta.json' | jq -r .targetAbi)
          echo "${manifest}: ${zip_name}, targetAbi ${abi}, md5 ${checksum}"

          jq --argjson shared "$SHARED" \
             --arg version "$VERSION" \
             --rawfile changelog CHANGELOG.md \
             --arg checksum "$checksum" \
             --arg timestamp "$TIMESTAMP" \
             --arg abi "$abi" \
             --arg url "https://github.com/${REPO}/releases/download/${VERSION}/${zip_name}" \
             '[$shared + {
               "versions": ([{
                 "version": $version,
                 "changelog": $changelog,
                 "targetAbi": $abi,
                 "sourceUrl": $url,
                 "checksum": $checksum,
                 "timestamp": $timestamp
               }] + .[0].versions)
             }]' "$manifest" > manifest.tmp && mv manifest.tmp "$manifest"

          # Only advertise an icon once one exists, rather than publishing a URL
          # that 404s in the plugin catalogue.
          if [ -f icon.png ]; then
            jq --arg imageUrl "https://raw.githubusercontent.com/${REPO}/main/icon.png" \
               '.[0].imageUrl = $imageUrl' "$manifest" > manifest.tmp && mv manifest.tmp "$manifest"
          else
            echo "No icon.png in the repository root; leaving imageUrl unset."
            jq 'del(.[0].imageUrl)' "$manifest" > manifest.tmp && mv manifest.tmp "$manifest"
          fi
        }

        publish manifest.json             jellyfin-10.11.11
        publish manifest-jellyfin-12.json jellyfin-12.0.0-rc5

        # A 12.0 server offered a 10.11 archive is the failure this split exists
        # to prevent, so assert the split rather than assume the loop above ran
        # the way it reads.
        for pair in "manifest.json:10.11.11.0" "manifest-jellyfin-12.json:12.0.0.0"; do
          file="${pair%%:*}"
          want="${pair##*:}"
          got=$(jq -r '.[0].versions[0].targetAbi' "$file")
          if [ "$got" != "$want" ]; then
            echo "::error::${file} now advertises targetAbi ${got}, expected ${want}"
            exit 1
          fi
        done

    # Pushed with GITHUB_TOKEN, which does not retrigger workflows, so this
    # commit cannot start another release run.
    - name: Commit updated manifest
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config user.name "voc0der"
        git config user.email "contact@netspace.in"
        git add manifest.json manifest-jellyfin-12.json
        # Conventional subject, same as every hand-written commit: CONTRIBUTING
        # sets one naming rule and a bot is not exempt from it.
        git commit -m "chore(release): update the plugin catalogues for version ${{ steps.version.outputs.version }}" || echo "No changes to commit"

        # A swallowed push failure is how 1.0.0.4 ended up released but absent
        # from the catalogue. Rebase onto whatever landed meanwhile and retry;
        # if it still will not go, fail the job rather than report success.
        for attempt in 1 2 3; do
          if git push; then
            exit 0
          fi
          echo "push rejected (attempt $attempt), rebasing onto origin/main"
          git fetch origin main
          git rebase origin/main || exit 1
        done

        echo "::error::Could not push the manifest update after 3 attempts"
        exit 1
