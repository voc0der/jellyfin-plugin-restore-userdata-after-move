name: Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # The plugin multi-targets net9.0 (Jellyfin 10.11.11) and net10.0 (12.0), so
    # both SDKs are needed to restore and build the whole solution.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Check whitespace formatting
      run: dotnet format whitespace --verify-no-changes --verbosity minimal

    - name: Check C# style formatting
      run: dotnet format style --verify-no-changes --severity warn --verbosity minimal

    - name: Run tests
      run: dotnet test tests/Jellyfin.Plugin.UserDataRestore.Core.Tests/ --verbosity minimal

    # The adapter half. These construct real Jellyfin entities and assert what
    # this plugin asks the server for and what it does with the answer — the
    # layer the core tests have to assume is correct.
    - name: Run the Jellyfin adapter tests
      run: dotnet test tests/Jellyfin.Plugin.UserDataRestore.Jellyfin.Tests/ --verbosity minimal

    # Multi-targeted on purpose: 10.11.11 is Entity Framework 9.0.11 and 12.0 RC5
    # is 10.0.10, and a query one translates is not automatically one the other
    # does. Running a single framework here would leave half the matrix untested.
    - name: Run the database tests against both provider stacks
      run: dotnet test tests/Jellyfin.Plugin.UserDataRestore.Database.Tests/ --verbosity minimal

    # The release workflow's one-release-per-commit invariant is three settings
    # deep and every one of them fails silently: a dropped pending run leaves no
    # release to notice the absence of. Assert them here rather than trust a
    # comment nobody reads while editing the file it sits in.
    - name: Check the release workflow still queues every commit
      run: python3 .github/workflows/check-release-concurrency.py

    # Same shape of silence, one workflow over. The live proof runs one job per
    # server line, so the list of lines exists in the harness and again in the
    # matrix, and a line added to only the first is never run by anything —
    # while every check stays green and the summary still reports a passing live
    # proof.
    - name: Check the live proof still covers every server line
      run: python3 .github/workflows/check-live-matrix.py
